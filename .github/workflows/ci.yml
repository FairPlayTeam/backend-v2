name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/fairplay?schema=public
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Check Prisma format
        run: bunx prisma format --check

      - name: Run checks
        run: bun run check

      - name: Generate OpenAPI specification
        run: bun run openapi:snapshot

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specification
          path: openapi.json
          if-no-files-found: error

  docker-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime Docker image
        run: docker build --target runtime --tag fp-backend:ci-runtime .

      - name: Build migrator Docker image
        run: docker build --target migrator --tag fp-backend:ci-migrator .
